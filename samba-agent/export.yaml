# 외부 기입 라우팅(스펙 2026-09-28 §4.1). 판매처 문자열에 표식이 들어 있으면 그 대상이다.
# 공백·대소문자는 무시한다. 주문 한 건은 한 곳에만 기입한다.

# 플레이오토 EMP 에 기입할 판매처
emp:
  - GS이숍
  - 롯데아이몰
  # 삼바웨이브 판매처 표기는 롯데홈쇼핑(계정) 이다 — EMP 에는 롯데아이몰로 들어온다(실기 2026-09-29)
  - 롯데홈쇼핑
  - 현대H몰
  - KT알파

# 어디에도 기입하지 않는 판매처
skip:
  - 포이즌
  - poizon
  # 삼바웨이브 판매처 표기가 poison(계정) 이다(실기 2026-09-29: 샵마인으로 잘못 갔다)
  - poison
  - 크림
  - kream

# 위에 해당하지 않는 나머지
# 샵마인 작업은 사용자 요청으로 중단(2026-10-31). EMP 대상만 유지한다.
default: null
