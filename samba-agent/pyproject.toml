[project]
name = "samba-agent"
version = "0.1.0"
description = "SAMBA 주문처리 감독자 하네스 (LangGraph)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=0.2.60",
  "langgraph-checkpoint-sqlite>=2.0.1",
  "langsmith>=0.1.140",
  "slack-bolt>=1.20.0",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "PyYAML>=6.0",
  "claude-agent-sdk>=0.1.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.7"]
# 입력 작업자(샵마인·EMP 화면 조작) — 하네스 본체에는 필요 없다
desktop = ["pywinauto>=0.6.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samba_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "werkzeug>=3.0",
]
