# 에이전트 등록부(스펙 §4.3). 새 소싱처는 여기가 아니라 sources.yaml 에 1행 + rules/ 파일 1개다.
# tools 는 브릿지 허용 목록이다 — 감독자가 그대로 에이전트에 넘기고, 목록 밖 호출은 거절된다.
# buyers_from: 구매 에이전트 행은 이 표에서 자동으로 만든다(buyer.<key>, match.source = id).
buyers_from: sources.yaml
agents:
  # 결제는 재시도가 없다 — 재결제 위험(스펙 §4.3-4)
  - name: payer
    kind: payer
    match: {}
    tools: [get_page, find_elements, ocr, run_js, run_script, save_script, click, fill_secret,
            phone_approve_payment, list_tabs, switch_tab, wait, login,
            phone_screenshot, phone_get_screen, progress, list_accounts]
    rules: rules/payer.md
    prompts: samba/payer
    dataset: ds.payer
    retry: 0
  - name: recorder
    kind: recorder
    match: {}
    tools: [get_page, find_elements, navigate, click, type, select, run_js, run_script, save_script,
            switch_tab, new_tab, progress]
    rules: rules/recorder.md
    prompts: samba/recorder
    dataset: ds.recorder
    retry: 1
  - name: verifier
    kind: verifier
    match: {}
    tools: [get_page, find_elements, ocr, navigate, run_js, run_script, save_script, switch_tab,
            list_tabs, progress]
    rules: rules/verifier.md
    prompts: samba/verifier
    dataset: ds.verifier
    retry: 1
