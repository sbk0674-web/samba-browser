# 소싱처 표 — 한 행 = 소싱처 1개. 새 소싱처는 여기 1행 + rules/buyer_<key>.md + 저장 스크립트.
#   id     : 삼바웨이브 source_site 값(주문 조회가 주는 값과 정확히 같다)
#   key    : 앱 저장 스크립트 접두어 — <key>_product_snapshot · <key>_set_shipping · checkout_enter_<key>
#   label  : 표시·별칭. 조회 결과가 한글 이름으로 와도 이 표를 거쳐 id 로 맞춘다
#   status : active(스크립트 완비) · scripts_pending(등록만, 구매 시작 시 사람에게) · hold(등록 안 함)
sources:
  - id: MUSINSA
    key: musinsa
    cross_with: 29CM   # 같은 상품을 29CM 에서도 비교해 싼 쪽에서 산다
    order_prep: true   # musinsa_order_prep — 적립금 5만 미만 0원·선할인(플레이북 §7)
    coupon_download: true   # musinsa_coupon_download — 상품 페이지 '쿠폰받기'로 안 받은 쿠폰을 먼저 받는다
    pay_card_quote: true    # musinsa_pay_card_quote — 무신사페이 등록 기본 카드 견적(롯데·현대 청구할인 비교)
    # 사용자 2026-09-24: 무신사 4계정 비교 — 계정마다 다른 건 쿠폰뿐(쿠폰·장바구니 쿠폰·선할인 반영 총액 최저 계정)
    buy_accounts: [buyer01, buyer02, buyer03, buyer05]
    normal_price: true  # 2026-09-24 musinsa_normal_price(정가 → 직배/까대기 판정)
    payment_quotes: true  # 2026-09-23 musinsa_payment_quotes
    label: 무신사
    home: https://www.musinsa.com/
    login_host: musinsa.com
    shipping_confirm: true
    status: active
    quick_compare: true  # 2026-09-26 musinsa_quick_price — 상품 페이지 '나의 할인가'·'최대 적립'으로 계정 하나만 고른다

  - id: 29CM
    key: cm29
    cross_with: MUSINSA   # 같은 상품을 무신사에서도 비교해 싼 쪽에서 산다
    pay_card_quote: true    # cm29_pay_card_quote — 29CM 주문서도 무신사페이 등록 기본 카드로 결제한다
    money_in_pay: true    # 29CM 무신사머니는 무신사페이 안의 결제 항목이다(2026-09-25)
    excluded_pay_providers: [toss]  # 29CM 토스페이 결제수단 목록에서 현대·LOCA 카드가 '가맹점 미지원' — 삼성(SSG.COM) 무이자만 된다(2026-10-07 실기). 현대 청구할인 견적이 틀려 K2(1267) 가 card_missing 반복
    normal_price: true  # 2026-09-25 cm29_normal_price(정가 → 포이즌 외 마켓 직배/까대기 판정)
    payment_quotes: true  # 2026-09-23 cm29_payment_quotes
    shipping_confirm: true  # 2026-09-26 cm29_set_shipping 은 저장하지 않는다 — 전화 채운 뒤 cm29_confirm_shipping 이 저장·선택
    label: 29CM
    home: https://www.29cm.co.kr/
    login_host: 29cm.co.kr
    # 앱에 이미 checkout_enter_29cm 로 저장돼 있다(이름 규칙 checkout_enter_cm29 가 아니다)
    checkout_script: checkout_enter_29cm
    status: active
  - id: ABCmart
    key: abc
    payment_quotes: true  # 2026-09-23 abc_payment_quotes
    label: ABC마트
    home: https://abcmart.a-rt.com/
    login_host: a-rt.com
    product_id: '[?&]prdtNo=(\d+)'
    status: active
    order_type: kkadaegi   # ABC마트 구매는 전부 사무실 배송(까대기) — 사용자 지시 2026-09-23
    pay_provider: naver   # ABC마트는 무조건 네이버페이 — 사용자 지시 2026-09-24
    order_prep: true   # abc_order_prep — 쿠폰적용 창에서 일반·플러스 쿠폰 최대 적용(2026-09-25, 없어서 쿠폰을 놓쳤다)
    coupon_download: true   # abc_coupon_download — 이벤트 페이지 '전체 쿠폰 다운로드'로 받을 수 있는 쿠폰을 먼저 받는다(2026-09-28)
    # 키마스터의 ABC(a-rt.com) 계정만 비교한다 — 삼바 주문계정(buyer05 등)이 키마스터에 없는데 그 계정으로 로그인했다(2026-09-25)
    buy_accounts: [buyer01, buyer02, buyer03, buyer04, buyer06, buyer07]   # 사용자 2026-09-28: ABC 계정 6개 전부 비교
  - id: LOTTEON
    key: lotteon
    payment_quotes: true  # 2026-09-23 lotteon_payment_quotes
    normal_price: true  # 2026-09-26 lotteon_normal_price(할인전 가격 → 포이즌 외 마켓 직배/까대기 판정)
    label: 롯데온
    home: https://www.lotteon.com/
    login_host: lotteon.com
    status: active
    # 2026-09-28 이식(사용자): 샵백 경유 → 롯데백화점 판매자만 → 포이즌은 바로구매(까대기), 그 밖은 선물하기 →
    # 선물 배송지(받는 분 주소로·새 등록·빠른 선물)는 lotteon_set_shipping + lotteon_confirm_shipping → L.POINT 전액 → 네이버페이
    entry_route: shopback
    required_seller: 롯데백화점
    gift_unless_poison: true
    shipping_confirm: true
    # 결제수단 고정(네이버페이)을 뺀다 — 모든 수단의 원가를 비교해 가장 싼 것으로(사용자 2026-09-27·09-30: 카카오페이 머니 7% 가 더 쌌다)
    # 롯데카드 할인은 '간편결제'(L.PAY 카드 = 롯데카드)로 받는다 — PC 웹 결제 비밀번호(키마스터 site 항목)로 끝나 폰이 필요 없다
    # (사용자 2026-10-06). 신용카드 탭의 롯데카드 앱카드(폰 숫자코드) 경로는 코드만 남기고 쓰지 않는다
    easy_pay_card: 롯데카드
    # 같은 상품을 SSG(신세계몰·백화점)에서도 견적해 싼 쪽에서 산다 — 사용자 2026-10-06(나이키 II7406: 롯데온 100,490 vs SSG 79,335)
    cross_with: SSG
    buy_accounts: [buyer01]
  # 그랜드스테이지는 ABC마트와 같은 a-rt.com 흐름이다 — 스크립트(key)를 그대로 공유한다
  - id: GrandStage
    key: abc
    label: 그랜드스테이지
    home: https://grandstage.a-rt.com/
    login_host: a-rt.com
    product_id: '[?&]prdtNo=(\d+)'
    status: active
  # Task E 에서 저장 스크립트를 만든다(확장앱 content-purchase-*.js 의 셀렉터를 옮겨 쓴다)
    order_type: kkadaegi   # ABC마트 흐름 공유 — 사무실 배송
    pay_provider: naver   # 그랜드스테이지도 무조건 네이버페이 — 사용자 지시 2026-09-24
    order_prep: true   # abc_order_prep — 쿠폰적용 창에서 일반·플러스 쿠폰 최대 적용(2026-09-25, 없어서 쿠폰을 놓쳤다)
    coupon_download: true   # abc_coupon_download — 이벤트 페이지 '전체 쿠폰 다운로드'로 받을 수 있는 쿠폰을 먼저 받는다(2026-09-28)
    # 키마스터의 ABC(a-rt.com) 계정만 비교한다 — 삼바 주문계정(buyer05 등)이 키마스터에 없는데 그 계정으로 로그인했다(2026-09-25)
    buy_accounts: [buyer01, buyer02, buyer03, buyer04, buyer06, buyer07]   # 사용자 2026-09-28: ABC 계정 6개 전부 비교

  - id: GSShop
    key: gsshop
    label: GS샵
    home: https://www.gsshop.com/
    login_host: gsshop.com
    status: active
  - id: SSG
    key: ssg
    label: SSG닷컴
    # 2026-09-28: www.ssg.com 홈은 무거워 로그인 확인이 20~40초 무응답으로 끝난다 → 가벼운 MY SSG 페이지에서 확인
    home: https://pay.ssg.com/myssg/orderInfo.ssg?viewType=Ssg
    login_host: ssg.com
    compare_accounts: false
    shipping_confirm: true
    payment_quotes: true  # 2026-09-27 ssg_payment_quotes(SSGPAY 등록 카드·SSG MONEY 충전결제)
    mall_item: true  # 2026-09-27 ssg_find_mall_item — 주문 링크가 신세계몰이 아니면 신세계몰 같은 모델 상품으로 산다
    route_compare: true  # 2026-09-27 ssg_route_quotes — 직접·다나와·애드픽(적립) 경로 원가 비교, 가장 싼 경로로 산다
    routes: [danawa, adpick]  # 직접 경로는 신세계몰 상품 주문서(first)로 비교에 들어간다. 사용자 2026-10-01·10-08: SSG 는 다나와 비교검색 기본(신세계몰 줄 ED901 만 — 개인판매자 제외). 애드픽은 적립을 원가에 넣지 않는다
    allow_department: true  # 사용자 2026-09-27: 신세계백화점(6009)도 허용. 이마트·트레이더스 등은 금지
    # 2026-09-29 사용자: 까대기(포이즌·라자다) 제외 전부 선물하기. 스냅샷(바로구매 주문서)으로 견적한 뒤 배송지 단계에서
    # ssg_gift_enter → ssg_gift_address(없으면 ssg_set_shipping{gift} → 전화 → ssg_gift_save_address) → ssg_login_check 로 선물 주문서로 바꿔 탄다
    gift_unless_poison: true
    status: active  # 2026-09-27 사용자 요청으로 켬(봇 차단이면 즉시 사람에게)
    # 2026-09-27 같은 상품을 현대H몰에서도 견적해 싼 쪽에서 산다. SSG 가 봇 차단(blocked)이면 H몰만 견적해 산다
    cross_with: HMALL
  # 현대H몰 — 삼바웨이브 pending 주문에 H몰 source_site 가 아직 없어 id 는 HMALL(2026-09-27 확인).
  # hold: H몰 주문은 받지 않고 SSG 교차 비교의 짝으로만 쓴다(Sources.cross_only)
  - id: HMALL
    key: hmall
    label: 현대H몰
    home: https://www.hmall.com/
    login_host: hmall.com
    product_id: '[?&]slitmCd=(\d+)'
    entry_route: danawa  # 사용자 2026-09-27: 반드시 다나와 경유(ReferCode 제휴할인). 직접 진입 금지
    routes: [danawa, adpick]  # 사용자 2026-09-27: H몰은 애드픽 적립 — 다나와 경유와 원가(결제액 − 적립) 비교해 싼 쪽
    order_prep: true  # hmall_order_prep — 최대 할인 + 포인트는 롯데 5% 즉시할인 기준금액(5만원)이 유지되는 선까지만
    payment_quotes: true  # hmall_payment_quotes — '카드' 탭 카드사별 총액
    shipping_confirm: true  # hmall_set_shipping 은 저장하지 않는다 — 전화 채운 뒤 hmall_confirm_shipping 이 저장·선택
    compare_accounts: false
    buy_accounts: [buyer01]  # 키마스터 H몰 계정 라벨(2026-09-27 hmall.com → buyer01, 앱 재시작 뒤 반영)
    direct_card: 롯데카드  # 사용자 2026-09-27: 롯데카드 직접 결제('카드' 탭 → 롯데). 결제창 승인은 사람(폰)
    pay_provider: card
    status: hold
  - id: FashionPlus
    key: fashionplus
    payment_quotes: true  # 2026-09-23 fashionplus_payment_quotes
    label: 패션플러스
    home: https://www.fashionplus.co.kr/
    login_host: fashionplus.co.kr
    product_id: '/goods/detail/(\d+)'
    pay_provider: naver   # 패션플러스는 네이버페이로 결제 — 사용자 결정 2026-09-27(키마스터 결제 항목 naver)
    order_prep: true   # fashionplus_order_prep — 쿠폰 최대할인·적립금 모두사용(2026-09-27)
    shipping_confirm: true   # 새 주소는 set_shipping 이 채우고 전화까지 넣은 뒤 fashionplus_confirm_shipping 이 '등록하기'로 반영
    # 2026-09-28: 키마스터 우선순위 1 은 buyer01. buyer03 프로필은 네이버 로그인이 풀려 결제창에서 막힌다 —
    # 그 연결이 정리되면 목록에 다시 넣어 두 계정을 비교한다
    buy_accounts: [buyer01]
    status: active
  # 아래는 아직 스크립트가 없다 — 등록은 하되 구매를 시작하면 '스크립트 미작성' 으로 사람에게 넘긴다.
  # home 을 확인하지 못한 곳은 비워 둔다(스크립트를 쓸 때 실제 주소로 채운다)
